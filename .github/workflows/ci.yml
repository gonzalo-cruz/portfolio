name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile the terminal portfolio
        run: python -m py_compile portfolio_cli.py

      - name: Verify the site assets are present
        run: test -f index.html && test -f css/styles.css && test -f js/main.js
