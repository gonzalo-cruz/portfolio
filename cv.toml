# ─────────────────────────────────────────────────────────────
#  cv.toml — canonical CV source
#
#  Edit this file only. Then:
#      python3 build_cv.py
#
#  Emits:  CV.md            (machine-readable, for agents)
#          cv/cv.json       (JSON Resume schema)
#          cv/index.html    (interactive, printable)
#
#  CV.tex / CV_print.tex stay hand-tuned on purpose: the PDF is a
#  design artifact, not a template. Update them here when content
#  changes materially.
#
#  Conventions
#    start / end   "YYYY-MM"; empty end = present
#    tracks        de | ml | ai  (drives the role lens)
#    tier          "primary" renders as its own accordion,
#                  "compact" renders in the short "also" list
# ─────────────────────────────────────────────────────────────

